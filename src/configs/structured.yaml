wandb:
  entity: ga624-imperial-college-london
  project: LPN-ARC-Structured

encoder_transformer:
  _target_: models.utils.EncoderTransformerConfig
  vocab_size: 10
  max_rows: 5
  max_cols: 5
  transformer_layer:
    _target_: models.utils.TransformerLayerConfig
    dropout_rate: 0.05
  variational: true

decoder_transformer:
  _target_: models.utils.DecoderTransformerConfig
  vocab_size: 10
  max_rows: 5
  max_cols: 5
  transformer_layer:
    _target_: models.utils.TransformerLayerConfig
    dropout_rate: 0.05

structured:
  artifacts:
    models:
      - "ga624-imperial-college-london/LPN-ARC/faithful-armadillo-406--checkpoint:latest"  # Model Pattern 1
      - "ga624-imperial-college-london/LPN-ARC/rich-meadow-339--checkpoint:latest"  # Model Pattern 2
      - "ga624-imperial-college-london/LPN-ARC/fiery-lion-340--checkpoint:latest"   # Model Pattern 3
  alphas: [0.3333333, 0.3333333, 0.3333333]     # uniform over 3 models - DISABLED for dynamic alphas
  # Optional: configuration describing the model architecture of the loaded checkpoints.
  # If provided, StructuredTrainer will instantiate enc/dec with these hyperparameters
  # to ensure parameter shapes match the artifacts.
  model_config:
    max_rows: 5
    max_cols: 5
    num_layers: 2
    num_heads: 6
    emb_dim_per_head: 12   # total emb dim = num_heads * emb_dim_per_head
    mlp_dim_factor: 4.0
    dropout_rate: 0.0
    attention_dropout_rate: 0.0
    latent_dim: 32
    variational: true
    latent_projection_bias: false

training:
  seed: 0
  use_hf: true
  batch_size: 128
  num_workers: 4
  repulsion_kl: 10
  learning_rate: 0.001
  contrastive_kl: 5
  inference_mode: "mean"
  prior_kl_coeff: null
  train_datasets: ""
  mixed_precision: false
  inference_kwargs: {}
  pattern_per_task: true
  repulsion_margin: 10
  struct_num_pairs: 4
  eval_every_n_logs: 5000
  log_every_n_steps: 100
  pairwise_kl_coeff: null
  linear_warmup_steps: 99
  decoder_expose_steps: 10000
  encoder_expose_steps: 5000
  resume_from_checkpoint: null
  online_data_augmentation: false
  struct_patterns_balanced: true
  eval_every_n_logs_phase_2: 5000
  gradient_accumulation_steps: 1
  save_checkpoint_every_n_logs: 10  # Save checkpoint every 100 logs (1000 steps with log_every_n_steps=100)

eval:
  dataset:
    folder: ""  # optional; when empty, evaluates on balanced struct sample (32 samples per pattern)
    use_hf: true
  struct_uniform: true
  struct_uniform_length: 96   # 32 per pattern
  batch_size: 96
  inference_mode: "mean"
  inference_kwargs: {}
  num_tasks_to_show: 3
  tsne_max_points: 500  # Should be divisible by 4 (points per group: 3 encoders + 1 context) for clean sampling  
  # Test datasets for comprehensive evaluation across all patterns
  eval_datasets:
    - generator: "STRUCT_PATTERN"
      name: "pattern_1"
      num_pairs: 4
      length: 144  # 32 samples per pattern (O, T, L)
      task_generator_kwargs:
        pattern: 1  # O-tetromino
      batch_size: 96
      num_tasks_to_show: 3
    - generator: "STRUCT_PATTERN"
      name: "pattern_2" 
      num_pairs: 4
      length: 144  # 32 samples per pattern (O, T, L)
      task_generator_kwargs:
        pattern: 2  # T-tetromino
      batch_size: 96
      num_tasks_to_show: 3
    - generator: "STRUCT_PATTERN"
      name: "pattern_3"
      num_pairs: 4
      length: 144  # 32 samples per pattern (O, T, L)
      task_generator_kwargs:
        pattern: 3  # L-tetromino
      batch_size: 96
      num_tasks_to_show: 3
  test_datasets: []


